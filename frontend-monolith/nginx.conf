# nginx sirve el build estático y resuelve el mismo contrato de rutas relativas
# que el proxy de Vite en desarrollo. Así el frontend no conoce URLs absolutas.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck del propio contenedor.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # /endorse-api/v1/... -> http://endorsements:8082/v1/...
    location /endorse-api/ {
        proxy_pass http://endorsements:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /routes-api/v1/... -> http://routes:8081/v1/...
    location /routes-api/ {
        proxy_pass http://routes:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
